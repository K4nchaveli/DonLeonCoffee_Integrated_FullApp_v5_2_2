  <title>Don Leon Coffee ☕ — საუკეთესო ყავა საქართველოში</title>

  <meta name="keywords" content="ყავა, Don Leon Coffee, ყავის მაღაზია, ქართული ყავა, coffee shop georgia">

</head>
<body>
  <header class="header">
    <div class="nav">
      <div class="logo"><a href="index.html">DonLeonCoffee</a></div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html">logIn</a></li>
      </ul>
    </div>
  </header>

  <main class="admin-container">
    <h1>Admin Panel</h1>

    <!-- <section id="loginSection">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required value="">
        <input type="password" id="password" placeholder="Password" required value="">
        <button type="submit">Login</button>
      </form>
    </section> -->


    <section id="loginSection">
      <h2>Login</h2>
      <form id="loginForm" autocomplete="off" novalidate>
        <!-- Hidden fake inputs (prevent browser autofill) -->
        <input type="text" name="fakeusernameremembered" tabindex="-1" autocomplete="username" style="position:absolute;left:-9999px;top:-9999px;opacity:0;">
        <input type="password" name="fakepasswordremembered" tabindex="-1" autocomplete="new-password" style="position:absolute;left:-9999px;top:-9999px;opacity:0;">
    
        <!-- Actual fields -->
        <input type="email" id="email" placeholder="Email" required autocomplete="off">
        <input type="password" id="password" placeholder="Password" required autocomplete="off">
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="productSection" class="hidden">
      <h2>Create / Edit Product</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="desc" placeholder="Short Description" required>
        <div class="upload-row">
          <input type="text" id="image" placeholder="Image URL (or upload below)" required style="flex:1">
          <input type="file" id="imageFile" accept=".jpg,.jpeg,.png,.webp">
          <button type="button" id="uploadBtn">Upload Image</button>
        </div>
        <input type="number" id="price" placeholder="Price (₾)" required step="0.01" min="0">
        <button type="submit" id="saveBtn">Add Product</button>
        <button type="button" id="cancelEdit" class="ghost hidden">Cancel</button>
      </form>

      <h2 style="margin-top:16px;">Products</h2>
      <div id="productList"></div>
    </section>
  </main>

  <footer class="footer">© 2025 DonLeonCoffee. ყველა უფლება დაცულია.</footer>
  <script type="module" src="admin.js"></script>
</body>
</html>
